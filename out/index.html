<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Addition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; color: #fff;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; align-items: center; justify-content: center;
           flex-direction: column; gap: 16px; text-align: center; padding: 32px; }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .msg  { font-size: 15px; color: rgba(255,255,255,0.5); line-height: 1.5; }
    .btn  { margin-top: 8px; padding: 12px 28px; border-radius: 999px;
            background: #7c3aed; color: #fff; font-size: 15px; font-weight: 600;
            border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="logo">✦ addition</div>
  <p class="msg">You appear to be offline.<br />Please check your connection and try again.</p>
  <button class="btn" onclick="location.reload()">Retry</button>
</body>
</html>
